# KCT Hub — production runtime on the VPS. Used by deploy/deploy.sh (images are built by
# deploy.sh with the env file passed as a BuildKit secret; do not `build` from here).
#
#   IMAGE_TAG=<git-sha> ENV_FILE=<APP_DIR>/.env.prod MEDIA_DIR=<DATA_DIR>/media APP_PORT=<PORT> \
#     docker compose -p kct-hub -f docker-compose.prod.yml up -d
#
# Sized for a small VPS: ~4 GB RAM + 8 GB swap, possibly shared with other workloads. The database is an external/managed Postgres (DATABASE_URL in the env file).
name: kct-hub

services:
  app:
    image: kct-hub:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: kct-hub-app
    restart: unless-stopped
    init: true # reaps zombie processes (sharp/child processes) and forwards SIGTERM cleanly
    stop_grace_period: 20s
    env_file:
      - ${ENV_FILE:?ENV_FILE is required}
    environment:
      # The env file's PORT is the PUBLIC host port; inside the container Next always listens on
      # 3000 (this overrides env_file).
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      # Cap the V8 heap below the container limit so Node GCs instead of being OOM-killed.
      NODE_OPTIONS: '--max-old-space-size=640'
    # Published on all interfaces (no reverse proxy in front). NOTE: Docker-published ports bypass
    # ufw — restrict access with the provider's cloud firewall if needed.
    ports:
      - '0.0.0.0:${APP_PORT:?APP_PORT is required}:3000'
    volumes:
      # Payload uploads (icons, screenshots, OG images). Must be owned by uid 1001.
      - ${MEDIA_DIR:?MEDIA_DIR is required}:/app/public/media
    # Not read-only: Next.js ISR writes revalidated pages into /app/.next.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Idle usage is ~150 MB; 1 GB covers Admin uploads (sharp) while leaving ~2.8 GB for the OS,
    # other stacks and `next build` (2–3 GB peak, spills into swap) during deploys.
    mem_limit: 1g
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/favicon.ico || exit 1']
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
